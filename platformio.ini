; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:lolin_s2_mini]
platform = espressif32
board = lolin_s2_mini
framework = arduino
lib_deps = adafruit/Adafruit NeoPixel@^1.15.5
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0

; The S2 Mini uses native USB rather than a USB-to-UART bridge. On some Linux
; systems, trying to toggle DTR/RTS on /dev/ttyACM* fails with Errno 71.
; PlatformIO's 1200-baud touch already enters the USB bootloader, so esptool
; can connect without performing another hardware reset.
; board_upload.before_reset = no_reset
; board_upload.after_reset = soft_reset
